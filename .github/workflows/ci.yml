name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Tag successful master build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          TAG="deploy-$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          git tag "$TAG" && git push origin "$TAG" || echo "tag exists"
